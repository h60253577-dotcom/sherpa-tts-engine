name: Build Sherpa TTS Android APK

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build Debug APK
        working-directory: android/SherpaOnnxTtsEngine
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug -Ptarget-abi=arm64-v8a --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sherpa-arm64-tts
          path: android/SherpaOnnxTtsEngine/app/build/outputs/apk/debug/*.apk
